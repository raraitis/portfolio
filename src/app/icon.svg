<!-- Striped-planet favicon. Colors mirror colors.saturn (src/styles/colors.ts)
     and the planet shader tint — keep in sync with the palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="16" fill="#f5f1e8"/>
  <g transform="rotate(-14 16 16)">
    <clipPath id="planet"><circle cx="16" cy="16" r="9.5"/></clipPath>
    <g clip-path="url(#planet)">
      <circle cx="16" cy="16" r="9.5" fill="#e8dcc6"/>
      <rect x="5" y="8"    width="22" height="1.7" fill="#383d36"/>
      <rect x="5" y="11.2" width="22" height="1.7" fill="#383d36"/>
      <rect x="5" y="14.4" width="22" height="1.7" fill="#383d36"/>
      <rect x="5" y="17.6" width="22" height="1.7" fill="#383d36"/>
      <rect x="5" y="20.8" width="22" height="1.7" fill="#383d36"/>
    </g>
  </g>
</svg>
